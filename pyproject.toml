[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marllib"
version = "1.1.0"
description = "A multi-agent reinforcement learning library migrated to modern Ray/RLlib."
readme = "README.md"
requires-python = "==3.12.*"
license = "MIT"
authors = [
  { name = "Replicable-MARL" },
]
dependencies = [
  "cloudpickle>=3.1.2",
  "dm-tree>=0.1.9",
  "gym==0.26.2",
  "gymnasium>=1.2.2",
  "icecream>=2.1.8",
  "mlagents>=0.21.1",
  "numpy==2.3.4",
  "pettingzoo==1.25.0",
  "pygame>=2.6.1",
  "PyYAML>=6.0.3",
  "ray[rllib,tune]>=2.54.0",
  "setuptools>=80",
  "SuperSuit>=3.10.0",
  "tabulate>=0.9.0",
  "torch==2.9.0",
  "tqdm>=4.67.3",
]
classifiers = [
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3",
]

[tool.setuptools.packages.find]
include = ["marllib*"]
exclude = ["docs*", "examples*", "tests*", "results*"]

[tool.setuptools.package-data]
marllib = ["**/*.yaml", "**/*.yml"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
override-dependencies = [
  "grpcio>=1.60.0",
  "gymnasium>=1.2.2",
  "markupsafe==2.1.5",
  "mlagents==1.1.0",
  "numpy==2.3.4",
  "onnx==1.15.0",
  "pettingzoo==1.25.0",
]
